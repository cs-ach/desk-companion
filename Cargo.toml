[workspace]
resolver = "3"
members = ["crates/protocol", "crates/plugin", "host", "pi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
protocol = { path = "crates/protocol" }
plugin = { path = "crates/plugin" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
